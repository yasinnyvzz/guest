<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How can a submarine stay underwater for weeks? (Defence MENA)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;height:auto;margin:0 auto}</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js" } }</script>
</head>
<body>
<script type="module">
// One film page, frame contract of tools/capture.mjs. Every pixel = f(frame). Boat at the origin, bow +X, up +Y.
// 1 unit ~ 5 m. Ten chapters (ROADMAP.md). URL: w, h, seed, capture=1, msaa.
import * as THREE from 'three';
import { buildLook } from './looks.mjs';
import { loadType, typeCheck, TYPE_FALLBACK } from './type.mjs';
import { ICON, WORDMARK } from './brand.mjs';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920, SEED = +q.get('seed') || 7;
const FPS = 30, DURATION = 76, FRAMES = FPS * DURATION;
const S = H / 1920;                                   // pixel scale for point sizes and overlay

// ------------------------------------------------------------------ helpers (pure)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const ease = (k) => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };   // heavy, damped
const win = (t, a, b, f = 0.6) => ss(a, a + f, t) * (1 - ss(b - f, b, t));
const hash = (n) => { const s = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453; return s - Math.floor(s); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const vl = (a, b, k) => a.clone().lerp(b, k);
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const h = (i, j) => hash(i * 57.0 + j * 131.0 + 0.5); const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v); }
const fbm = (x, y) => { let a = 0.5, s = 0; for (let o = 0; o < 5; o++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return s; };

// Chapter times (s)
const CH = [0, 7, 14, 22, 30, 37, 47, 55, 63, 69, 76];
const chapterOf = (t) => { for (let i = CH.length - 2; i >= 0; i--) if (t >= CH[i]) return i; return 0; };

// ------------------------------------------------------------------ renderer, scene
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, W / H, 0.05, 400);
const C = {
  deep: new THREE.Color('#041624'), mid: new THREE.Color('#0d4466'), up: new THREE.Color('#2b8cb8'),
  hull: new THREE.Color('#2a3138'), ghost: new THREE.Color('#9ec3d9'), steel: new THREE.Color('#7c8a95'),
  warm: new THREE.Color('#e8b27a'), red: new THREE.Color('#e3232c'), cool: new THREE.Color('#cdeeff'), co2: new THREE.Color('#d2453c'),
};
scene.fog = new THREE.FogExp2(C.mid.clone().multiplyScalar(0.55), 0.03);

// Lights: surface key from above, cool hemisphere, rim from behind, warm practical inside.
const hemi = new THREE.HemisphereLight(0x6cc2e6, 0x0a2230, 1.0);
const key = new THREE.DirectionalLight(0xbfe6ff, 2.2); key.position.set(3, 20, 4);
const rim = new THREE.DirectionalLight(0x8fd0ff, 1.4); rim.position.set(-8, 3, -10);
const fill = new THREE.DirectionalLight(0x2a6d92, 0.5); fill.position.set(6, -4, 8);
const practical = new THREE.PointLight(0xffb36b, 0, 3.2, 1.4); practical.position.set(0.25, 0.3, -0.3);
const practical2 = new THREE.PointLight(0xffb36b, 0, 2.6, 1.6); practical2.position.set(-1.9, 0.1, -0.1);
scene.add(hemi, key, rim, fill, practical, practical2);

// ------------------------------------------------------------------ water: sky dome, surface, light shafts, snow
const dome = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uDeep: { value: C.deep }, uMid: { value: C.mid }, uUp: { value: C.up }, uBright: { value: 1 }, uDark: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uDeep,uMid,uUp; uniform float uBright,uDark; varying vec3 vDir;
    void main(){ float y = vDir.y;
      vec3 c = mix(uDeep, uMid, smoothstep(-0.55, 0.15, y));
      c = mix(c, uUp, smoothstep(0.15, 0.95, y) * uBright);
      c += vec3(0.55,0.85,1.0) * pow(max(y,0.0), 8.0) * 0.35 * uBright;
      c *= (1.0 - uDark);
      gl_FragColor = vec4(c, 1.0); }`,
}));
dome.renderOrder = -10; scene.add(dome);

const surface = new THREE.Mesh(new THREE.PlaneGeometry(400, 400, 1, 1), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
  uniforms: { uT: { value: 0 }, uAmt: { value: 1 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uT,uAmt; varying vec3 vW;
    float r(vec2 p){ return sin(p.x*1.7+uT*0.9)*sin(p.y*1.3-uT*0.7) + 0.5*sin(p.x*3.1-p.y*2.3+uT*1.6); }
    void main(){ vec2 p = vW.xz*0.55; float c = r(p) + 0.6*r(p*2.3+7.0);
      float cau = pow(clamp(0.5 + 0.35*c, 0.0, 1.0), 3.0);
      vec3 vd = normalize(vW - cameraPosition); float win = smoothstep(0.62, 0.86, abs(vd.y));
      vec3 col = mix(vec3(0.10,0.42,0.58), vec3(0.85,0.97,1.0), cau);
      vec3 mir = vec3(0.02,0.09,0.14);
      gl_FragColor = vec4(mix(mir, col * (0.55 + 0.9*cau), win), (0.15 + 0.8*win) * uAmt); }`,
}));
surface.rotation.x = Math.PI / 2; scene.add(surface);

const RAYS = [];
const rayMat = (i) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, side: THREE.DoubleSide,
  uniforms: { uT: { value: 0 }, uAmt: { value: 1 }, uPh: { value: hash(i + 3) * 6.28 } },
  vertexShader: `varying vec2 vUv; varying vec3 vW; void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uT,uAmt,uPh; varying vec2 vUv; varying vec3 vW;
    void main(){ float across = pow(sin(3.14159*vUv.x), 2.0);
      float down = pow(vUv.y, 2.2);
      float fl = 0.6 + 0.4*sin(uT*0.55 + uPh + vUv.y*3.0);
      float d = length(vW - cameraPosition); float fade = smoothstep(1.5, 5.0, d) * exp(-d*0.03);
      gl_FragColor = vec4(vec3(0.55,0.82,1.0) * across * down * fl * fade * 0.11 * uAmt, 1.0); }`,
});
for (let i = 0; i < 14; i++) {
  const w = 1.2 + hash(i) * 2.6, m = new THREE.Mesh(new THREE.PlaneGeometry(w, 70), rayMat(i));
  m.userData = { x: (hash(i + 20) - 0.5) * 30, z: (hash(i + 40) - 0.5) * 26 - 2, tilt: (hash(i + 60) - 0.5) * 0.25 };
  m.renderOrder = 5; RAYS.push(m); scene.add(m);
}

function pointsMat(color, size, extra = {}) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uCol: { value: color.clone() }, uSize: { value: size * S }, uAmt: { value: 1 }, uOff: { value: new THREE.Vector3() },
      uCam: { value: new THREE.Vector3() }, uBox: { value: 18 }, uT: { value: 0 }, ...extra.uniforms },
    vertexShader: extra.vertex || `attribute float aR; uniform vec3 uOff,uCam; uniform float uBox,uSize,uT; varying float vA;
      void main(){ vec3 p = position + uOff; p.x += sin(uT*0.3 + aR*40.0)*0.15; p.y += cos(uT*0.23 + aR*31.0)*0.12;
        p = mod(p - uCam + uBox*0.5, uBox) - uBox*0.5 + uCam;
        vec4 mv = viewMatrix * vec4(p,1.0); float d = -mv.z; gl_Position = projectionMatrix*mv;
        gl_PointSize = uSize * (0.6 + aR) * 6.0 / max(d, 0.4);
        vA = smoothstep(0.6, 2.0, d) * (1.0 - smoothstep(5.0, uBox*0.5, d)); }`,
    fragmentShader: extra.fragment || `uniform vec3 uCol; uniform float uAmt; varying float vA;
      void main(){ vec2 c = gl_PointCoord - 0.5; float r = length(c); if (r > 0.5) discard;
        float a = smoothstep(0.5, 0.0, r); gl_FragColor = vec4(uCol * a * vA * uAmt * 0.55, 1.0); }`,
  });
}
const snowGeo = new THREE.BufferGeometry(); {
  const n = 2600, pos = new Float32Array(n * 3), r = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos[3 * i] = (hash(i * 3.1) - 0.5) * 18; pos[3 * i + 1] = (hash(i * 5.7) - 0.5) * 18; pos[3 * i + 2] = (hash(i * 9.3) - 0.5) * 18; r[i] = hash(i * 1.9); }
  snowGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); snowGeo.setAttribute('aR', new THREE.BufferAttribute(r, 1));
}
const snow = new THREE.Points(snowGeo, pointsMat(new THREE.Color('#bcd9e8'), 1.5)); snow.frustumCulled = false; scene.add(snow);

// ------------------------------------------------------------------ the boat (one model for the whole film)
const boat = new THREE.Group(); scene.add(boat);
const R = 0.66, XB = 6.5, XM = 4.4, XT = -3.2, XS = -6.45;
function hullProfile(r0, xb, xm, xt, xs, rEnd) {
  const pts = [];
  for (let i = 0; i <= 28; i++) { const k = i / 28, x = lerp(xs, xt, k);   // tail cone
    const u = (xt - x) / (xt - xs); pts.push(new THREE.Vector2(lerp(r0, rEnd, Math.pow(u, 1.7)), x)); }
  for (let i = 1; i <= 8; i++) pts.push(new THREE.Vector2(r0, lerp(xt, xm, i / 8)));
  for (let i = 1; i <= 30; i++) { const k = i / 30, x = lerp(xm, xb, k);    // faired bow
    pts.push(new THREE.Vector2(r0 * Math.pow(Math.max(0, 1 - Math.pow(k, 2.3)), 1 / 2.3), x)); }
  pts[pts.length - 1].x = 0.0001;
  const g = new THREE.LatheGeometry(pts, 96); g.rotateZ(-Math.PI / 2); g.computeVertexNormals(); return g;
}
// Anechoic tiles: a bump texture of offset tiles with slight variation (tile ~0.22 u).
const tileTex = (() => { const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const v = 118 + Math.floor(hash(i * 17 + j * 31) * 20);
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(i * 32 + (j % 2) * 16 + 1.5, j * 32 + 1.5, 29, 29); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 20); return t; })();

const solidMat = new THREE.MeshStandardMaterial({ color: C.hull, roughness: 0.62, metalness: 0.2, bumpMap: tileTex, bumpScale: 0.6,
  transparent: true, opacity: 1 });
const ghostMat = (col = C.ghost, power = 2.6, base = 0.03) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide, fog: false,
  uniforms: { uCol: { value: col.clone() }, uAmt: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 w = modelMatrix*vec4(position,1.0);
    vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform vec3 uCol; uniform float uAmt; varying vec3 vN; varying vec3 vV;
    void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), ${power.toFixed(2)});
      gl_FragColor = vec4(uCol * (f*0.75 + ${base.toFixed(3)}) * uAmt, 1.0); }`,
});
const outerGeo = hullProfile(R, XB, XM, XT, XS, 0.13);
const outerSolid = new THREE.Mesh(outerGeo, solidMat);
const GHOSTS = [];
const outerGhost = new THREE.Mesh(outerGeo, ghostMat()); outerGhost.renderOrder = 8; GHOSTS.push(outerGhost);
boat.add(outerSolid, outerGhost);

// Casing (deck), sail, planes, propulsor: each has a solid and a ghost twin.
function twin(geo, pos, rot = [0, 0, 0], parent = boat) {
  const s = new THREE.Mesh(geo, solidMat), g = new THREE.Mesh(geo, ghostMat()); g.renderOrder = 8; GHOSTS.push(g);
  for (const m of [s, g]) { m.position.copy(pos); m.rotation.set(...rot); parent.add(m); }
  return s;
}
const roundedBox = (w, h, d, r) => { const sh = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r); sh.lineTo(x + w, y + h - r);
  sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h); sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
  sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3, curveSegments: 10 });
  g.translate(0, 0, -d / 2); return g; };
// deck casing along the top
twin(roundedBox(8.0, 0.16, 0.5, 0.06), V(0.8, R - 0.03, 0));
// sail: stadium plan, extruded upward, slight taper by scale
{ const sh = new THREE.Shape(); const L = 1.55, Wd = 0.34;
  sh.absarc(L / 2 - Wd / 2, 0, Wd / 2, -Math.PI / 2, Math.PI / 2, false); sh.lineTo(-L / 2 + Wd * 0.9, Wd / 2);
  sh.quadraticCurveTo(-L / 2, Wd * 0.25, -L / 2, 0); sh.quadraticCurveTo(-L / 2, -Wd * 0.25, -L / 2 + Wd * 0.9, -Wd / 2); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 1.0, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4, curveSegments: 24 });
  g.rotateX(-Math.PI / 2); twin(g, V(2.15, 0.52, 0)); }
// masts (raised only for the reveal)
const masts = new THREE.Group(); boat.add(masts);
for (const [x, h, r] of [[2.55, 0.62, 0.035], [2.25, 0.5, 0.03], [1.95, 0.42, 0.04], [1.7, 0.3, 0.022]]) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.8, r, h, 16), solidMat); m.position.set(x, 1.55 + h / 2 - 0.1, 0); masts.add(m);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(r * 1.25, 16, 10), solidMat); hd.position.set(x, 1.55 + h - 0.1, 0); hd.scale.set(1, 1.6, 1); masts.add(hd);
}
// cruciform stern planes and bow planes
const finGeo = (root, tip, span, sweep) => { const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(root, 0);
  sh.lineTo(root - sweep, span); sh.lineTo(root - sweep - tip, span); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
  g.translate(0, 0, -0.0175); return g; };
const sternFin = finGeo(1.05, 0.45, 0.82, 0.25);
for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2;
  const s = twin(sternFin, V(-6.0, 0, 0), [a, 0, 0]); s.geometry = sternFin;
  const grp = boat.children.slice(-2); for (const m of grp) { m.position.set(-6.05, Math.cos(a) * 0.18, Math.sin(a) * 0.18); } }
const bowFin = finGeo(0.42, 0.24, 0.32, 0.08);
for (const z of [1, -1]) { twin(bowFin, V(4.95, 0.12, z * 0.55), [z * Math.PI / 2, 0, 0]); }
// propulsor: 7 skewed blades on a hub
const prop = new THREE.Group(); prop.position.set(-6.62, 0, 0); boat.add(prop);
const propMat = new THREE.MeshStandardMaterial({ color: '#8a7a5e', roughness: 0.35, metalness: 0.85, side: THREE.DoubleSide });
{ const hub = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42, 32), propMat); hub.rotation.z = Math.PI / 2; hub.position.x = -0.16; prop.add(hub);
  const sh = new THREE.Shape(); sh.moveTo(0, 0.08);
  sh.bezierCurveTo(0.12, 0.25, 0.2, 0.45, 0.06, 0.62); sh.bezierCurveTo(-0.02, 0.66, -0.1, 0.6, -0.12, 0.5);
  sh.bezierCurveTo(-0.05, 0.35, -0.08, 0.2, -0.1, 0.08); sh.closePath();
  const bg = new THREE.ShapeGeometry(sh, 16);
  for (let k = 0; k < 7; k++) { const b = new THREE.Mesh(bg, propMat); const piv = new THREE.Group();
    b.rotation.y = Math.PI / 2 - 0.5; piv.add(b); piv.rotation.x = k * Math.PI * 2 / 7; prop.add(piv); } }

// ------------------------------------------------------------------ inside: pressure hull, frames, decks, crew
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 2.0);   // removes z > constant
const CLIP = [cutPlane];
const inner = new THREE.Group(); boat.add(inner);
const phMat = new THREE.MeshStandardMaterial({ color: C.steel, roughness: 0.42, metalness: 0.65, side: THREE.DoubleSide,
  clippingPlanes: CLIP, transparent: true, opacity: 0 });
const phGeo = (() => { const pts = []; const r0 = 0.56, a = -4.35, b = 4.15, ea = 0.42, eb = 0.38;
  for (let i = 0; i <= 16; i++) { const k = i / 16; pts.push(new THREE.Vector2(r0 * Math.sin(k * Math.PI / 2) + 1e-4, a - ea * Math.cos(k * Math.PI / 2))); }
  for (let i = 0; i <= 16; i++) { const k = i / 16; pts.push(new THREE.Vector2(r0 * Math.cos(k * Math.PI / 2) + 1e-4, b + eb * Math.sin(k * Math.PI / 2))); }
  const g = new THREE.LatheGeometry(pts, 96); g.rotateZ(-Math.PI / 2); return g; })();
const pHull = new THREE.Mesh(phGeo, phMat); inner.add(pHull);
const pGhost = new THREE.Mesh(phGeo, ghostMat(C.ghost, 2.0, 0.02)); pGhost.renderOrder = 7; inner.add(pGhost);
// ring frames
const NF = 26, frameXs = [...Array(NF)].map((_, i) => lerp(-4.05, 3.95, i / (NF - 1)));
const frameMat = new THREE.MeshStandardMaterial({ color: '#5d6872', roughness: 0.4, metalness: 0.7, clippingPlanes: CLIP, transparent: true, opacity: 0 });
const frameEmis = new THREE.MeshBasicMaterial({ color: C.red, clippingPlanes: CLIP, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const frameGeo = new THREE.TorusGeometry(0.54, 0.013, 8, 72); frameGeo.rotateY(Math.PI / 2);
const frames = [], frameGlows = [];
for (const x of frameXs) { const m = new THREE.Mesh(frameGeo, frameMat); m.position.x = x; inner.add(m); frames.push(m);
  const gm = new THREE.Mesh(frameGeo, frameEmis.clone()); gm.position.x = x; gm.scale.setScalar(1.002); inner.add(gm); frameGlows.push(gm); }
// pressure arrows (S01)
const arrows = new THREE.Group(); boat.add(arrows);
const arrowMat = new THREE.MeshBasicMaterial({ color: '#d7ecf7', transparent: true, opacity: 0, depthWrite: false });
{ const shaft = new THREE.CylinderGeometry(0.028, 0.028, 0.5, 10); shaft.translate(0, 0.25 + 0.18, 0);
  const head = new THREE.ConeGeometry(0.1, 0.2, 16); head.rotateZ(Math.PI); head.translate(0, 0.1, 0);
  for (const x of [-4.2, -1.8, 0.6, 3.0]) for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2 + x * 0.3;
    const g = new THREE.Group(); g.add(new THREE.Mesh(shaft, arrowMat), new THREE.Mesh(head, arrowMat));
    g.position.set(x, 0, 0); g.rotation.x = a; g.userData = { a, x }; arrows.add(g); } }

// Interior (lit by the practicals): deck, bulkheads, consoles, pipes, crew.
const intMat = new THREE.MeshStandardMaterial({ color: '#66717b', roughness: 0.8, metalness: 0.2, clippingPlanes: CLIP, transparent: true, opacity: 0 });
const INT = [intMat];
const deck = new THREE.Mesh(new THREE.BoxGeometry(8.0, 0.035, 0.94), intMat); deck.position.set(-0.1, -0.2, 0); inner.add(deck);
for (const x of [-3.15, -1.15, 1.55, 3.2]) { const bh = new THREE.Mesh(new THREE.CylinderGeometry(0.54, 0.54, 0.03, 48), intMat);
  bh.rotation.z = Math.PI / 2; bh.position.x = x; inner.add(bh);
  const door = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.04, 32), new THREE.MeshStandardMaterial({ color: '#20262c', roughness: 0.6, clippingPlanes: CLIP, transparent: true, opacity: 0 }));
  door.rotation.z = Math.PI / 2; door.position.set(x, 0.02, -0.05); door.scale.set(1, 1, 1.25); inner.add(door); INT.push(door.material); }
const screenMat = new THREE.MeshBasicMaterial({ color: '#3fa8b8', transparent: true, opacity: 0 });

for (const n of (q.get('hide') || '').split(',').filter(Boolean)) ({ surface, dome, snow, boat, seabed, sonarField, echo, track }[n] || RAYS[0]).visible = false, (n === 'rays') && RAYS.forEach((m) => { m.userData.hidden = 1; });
